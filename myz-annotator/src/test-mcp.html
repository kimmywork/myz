<!DOCTYPE html>
<html>
<head>
  <title>MCP Test</title>
</head>
<body>
  <h1>MCP Connection Test</h1>
  <button id="test">Test LogSeq MCP</button>
  <div id="result"></div>
  
  <script type="module">
    const testBtn = document.getElementById('test');
    const resultDiv = document.getElementById('result');
    
    testBtn.addEventListener('click', async () => {
      try {
        const result = await chrome.runtime.sendMessage({
          type: "myz:testMcpConnection",
          payload: {
            serverConfig: {
              name: "LogSeq",
              url: "http://127.0.0.1:61775",
              enabled: true,
              headers: {}
            }
          }
        });
        
        resultDiv.innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        console.log('MCP Test Result:', result);
      } catch (e) {
        resultDiv.innerHTML = '<pre style="color: red;">Error: ' + e.message + '</pre>';
      }
    });
  </script>
</body>
</html>
