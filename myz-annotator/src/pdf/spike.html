<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyZ PDF Spike</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        margin-bottom: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      input[type="text"] {
        min-width: 320px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0b1220;
        color: #e2e8f0;
      }
      #status {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        background: #0b1220;
        border: 1px solid #1e293b;
        border-radius: 6px;
        padding: 8px;
        max-height: 160px;
        overflow: auto;
        margin-bottom: 12px;
      }
      #viewer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .page {
        position: relative;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      .page canvas {
        display: block;
      }
      .overlayLayer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .myz-hl {
        position: absolute;
        background: rgba(181, 137, 0, 0.35);
        border-radius: 2px;
      }
      .textLayer ::selection {
        background: rgba(56, 189, 248, 0.4);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MyZ PDF Spike</h1>
      <div id="env"></div>
    </header>
    <div id="controls">
      <input id="urlInput" type="text" />
      <button id="loadUrl">加载 URL PDF</button>
      <button id="openLocal">打开本地 PDF</button>
      <button id="restoreLocal">恢复上次本地 PDF</button>
      <button id="fingerprint">显示指纹</button>
      <button id="clear">清空</button>
    </div>
    <div id="status">idle</div>
    <div id="viewer"></div>
    <script type="module" src="./spike.ts"></script>
  </body>
</html>
