<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MyZ icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2FD0BF"/>
      <stop offset="100%" stop-color="#6AC3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background circle with subtle shadow -->
  <g filter="url(#shadow)">
    <circle cx="64" cy="64" r="56" fill="url(#bgGrad)"/>
  </g>

  <!-- stylized 'Z' glyph: original design (not a copy of any trademark) -->
  <g transform="translate(0,0)">
    <path d="M36 34
             L92 34
             L48 64
             L92 94
             L36 94"
          fill="none"
          stroke="#0B1F2D"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.95"/>
    <!-- interior accent to give depth -->
    <path d="M42 40
             L88 40
             L52 64
             L88 88
             L42 88"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.22"/>
  </g>

  <title>MyZ - stylized Z icon</title>
</svg>
