<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyZ Indexer Performance Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    button { cursor: pointer; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; margin-right: 5px; }
    button:disabled { background: #ccc; }
    .log { background: #f4f4f4; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .stat-box { background: #e9ecef; padding: 10px; border-radius: 4px; text-align: center; }
    .stat-value { font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <nav style="margin-bottom: 20px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
    <a href="index.html" style="margin-right: 15px; text-decoration: none; color: #333;">Main Demo</a>
    <a href="perf-test.html" style="font-weight: bold; text-decoration: none; color: #007bff;">Performance Test</a>
  </nav>

  <h1>MyZ Indexer Performance Test Suite</h1>
  
  <div class="card">
    <h3>Status</h3>
    <div id="status">Initializing...</div>
  </div>

  <div class="card">
    <h3>Test Controls</h3>
    <div class="stats">
      <div class="stat-box">
        <div>Documents</div>
        <div id="docCount" class="stat-value">0</div>
      </div>
      <div class="stat-box">
        <div>Index Time</div>
        <div id="indexTime" class="stat-value">-</div>
      </div>
      <div class="stat-box">
        <div>Search Time</div>
        <div id="searchTime" class="stat-value">-</div>
      </div>
    </div>
    
    <div style="margin-bottom: 10px;">
      <label>Batch Size: <input type="number" id="batchSize" value="10" style="width: 60px;"></label>
      <label>Max Docs: <input type="number" id="maxDocs" value="200" style="width: 80px;"></label>
      <label><input type="checkbox" id="useBruteForce"> Use Brute Force Search</label>
    </div>

    <button id="btnLoadQA">1b. Load QA Dataset (Small)</button>
    <button id="btnLoadHF">1c. Load HF Dataset (Large)</button>
    <button id="btnRunIndex" disabled>2. Run Indexing Test</button>
    <button id="btnRunSearch" disabled>3. Run Search Test</button>
    <button id="btnClear" style="background: #dc3545;">Clear DB</button>
  </div>

  <div class="card">
    <h3>Logs</h3>
    <div id="log" class="log"></div>
  </div>

  <script type="module" src="/ui/perf-test.ts"></script>
</body>
</html>
