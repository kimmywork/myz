<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyZ Indexer Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    button { cursor: pointer; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #ccc; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>MyZ Indexer (Service Worker Mode)</h1>
  
  <div class="card">
    <h3>Configuration</h3>
    <div style="margin-bottom: 10px;">
      <label>Embedder: 
        <select id="embedderType">
          <option value="local">Local (Transformers.js)</option>
          <option value="openai">OpenAI</option>
        </select>
      </label>
    </div>
    <div id="openaiConfig" style="display: none; border-top: 1px solid #eee; padding-top: 10px;">
      <label>API Key: <input type="password" id="openaiKey" placeholder="sk-..."></label>
      <label>Endpoint: <input type="text" id="openaiEndpoint" value="https://api.openai.com/v1"></label>
      <label>Model: <input type="text" id="openaiModel" value="text-embedding-3-small"></label>
    </div>
  </div>

  <div class="card">
    <h3>Migration</h3>
    <button id="btnMigrate">Migrate to Selected Embedder</button>
    <button id="btnStopMigrate" disabled>Stop</button>
    <div id="migrationStatus" style="margin-top: 10px; font-family: monospace;"></div>
  </div>

  <div class="card">
    <h3>Status</h3>
    <div id="status">Initializing...</div>
  </div>

  <div class="card">
    <h3>Add Document</h3>
    <textarea id="docText" rows="3" placeholder="Enter text to index..."></textarea>
    <button id="btnAdd">Index Text</button>
  </div>

  <div class="card">
    <h3>Search</h3>
    <input type="text" id="queryInput" placeholder="Search query...">
    <label><input type="checkbox" id="useBruteForce"> Use Brute Force</label>
    <button id="btnSearch">Search</button>
    <div id="results"></div>
  </div>
  
  <div class="card">
    <h3>All Documents</h3>
    <button id="btnList">Refresh List</button>
    <button id="btnClear" style="background: #dc3545;">Clear DB</button>
    <pre id="docList"></pre>
  </div>

  <script type="module" src="/ui/main.ts"></script>
</body>
</html>
