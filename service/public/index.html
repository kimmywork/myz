<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyZ Annotator - 用户门户</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MyZ Annotator</h1>
            <p class="subtitle">云端标注同步服务</p>
        </header>

        <div id="auth-section" class="card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>

            <!-- Login Form -->
            <div id="login-tab" class="tab-content active">
                <h2>用户登录</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">邮箱地址</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <div class="form-group">
                        <div class="captcha-container" id="login-captcha-container">
                            <canvas id="login-captcha-canvas" width="200" height="60"></canvas>
                            <button type="button" class="refresh-captcha" onclick="refreshCaptcha('login')">🔄</button>
                        </div>
                        <input type="text" id="login-captcha" placeholder="输入上方验证码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                    <div class="oauth-buttons">
                        <button type="button" class="btn btn-oauth" onclick="oauthLogin('google')">
                            <span>Google 登录</span>
                        </button>
                        <button type="button" class="btn btn-oauth" onclick="oauthLogin('github')">
                            <span>GitHub 登录</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-tab" class="tab-content">
                <h2>用户注册</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-email">邮箱地址</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码 (至少8位)</label>
                        <input type="password" id="register-password" minlength="8" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password-confirm">确认密码</label>
                        <input type="password" id="register-password-confirm" minlength="8" required>
                    </div>
                    <div class="form-group">
                        <div class="captcha-container" id="register-captcha-container">
                            <canvas id="register-captcha-canvas" width="200" height="60"></canvas>
                            <button type="button" class="refresh-captcha" onclick="refreshCaptcha('register')">🔄</button>
                        </div>
                        <input type="text" id="register-captcha" placeholder="输入上方验证码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                    <div class="oauth-buttons">
                        <button type="button" class="btn btn-oauth" onclick="oauthLogin('google')">
                            <span>Google 注册</span>
                        </button>
                        <button type="button" class="btn btn-oauth" onclick="oauthLogin('github')">
                            <span>GitHub 注册</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Dashboard Section (hidden initially) -->
        <div id="dashboard-section" class="card" style="display: none;">
            <div class="dashboard-header">
                <h2>用户仪表板</h2>
                <button class="btn btn-secondary" onclick="logout()">退出登录</button>
            </div>

            <div class="user-info">
                <h3>账户信息</h3>
                <p><strong>邮箱:</strong> <span id="user-email"></span></p>
                <p><strong>验证状态:</strong> <span id="email-status"></span></p>
                <p><strong>认证方式:</strong> <span id="auth-provider"></span></p>
                <p><strong>注册时间:</strong> <span id="created-at"></span></p>
                <div id="verification-alert" class="alert alert-warning" style="display: none;">
                    <p>您的邮箱尚未验证，请查看邮件并点击验证链接。</p>
                    <button class="btn btn-sm" onclick="resendVerification()">重新发送验证邮件</button>
                </div>
            </div>

            <div class="sync-info">
                <h3>同步状态</h3>
                <div id="sync-status-content">
                    <p>加载中...</p>
                </div>
                <button class="btn btn-primary" onclick="refreshSyncStatus()">刷新状态</button>
            </div>

            <div class="sync-history">
                <h3>同步历史</h3>
                <div id="sync-history-content">
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <div id="message-box" class="message-box"></div>
    </div>

    <script src="/js/captcha.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
