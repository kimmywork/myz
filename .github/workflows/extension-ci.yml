name: myz-annotator CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - "myz-annotator/**"
      - "packages/**"
      - ".github/workflows/extension-ci.yml"

jobs:
  build-and-test:
    name: Build and test myz-annotator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The repo is an npm workspaces monorepo: the extension's build toolchain
      # (vue-tsc / vite / typescript) lives in the ROOT package.json, so the
      # install must run at the repo root, not inside myz-annotator.
      - name: Install dependencies
        working-directory: .
        run: npm install

      - name: Build myz-annotator
        working-directory: myz-annotator
        run: npm run build --if-present

      - name: Install Playwright browsers and system deps
        working-directory: myz-annotator
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: myz-annotator
        run: xvfb-run npx playwright test tests --config=tests/playwright.config.ts --reporter=list,html
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: myz-annotator/playwright-report

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: myz-annotator/test-results
